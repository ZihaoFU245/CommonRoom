[package]
name = "commonroom-agent-cell"
version = "0.1.0"
edition = "2024"
description = "CommonRoom bot agent cell: a rig agent compiled to WebAssembly."
publish = false

# Standalone crate on purpose. It is deliberately NOT a workspace member: the
# chat server builds for native targets, this crate builds for
# wasm32-unknown-unknown and is loaded by the Deno agent host.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rig-core = { version = "=0.42.0", default-features = false, features = ["derive", "rustls"] }
rig-agent = { version = "=0.42.0", default-features = false, features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
