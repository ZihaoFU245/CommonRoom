# Include inside an existing HTTPS server {} block under http {}.
# That server supplies TLS certificates and HTTP-to-HTTPS redirects.
# Extract ui.tar.xz into /srv/commonroom: the archive creates dist/.
# Change the alias below to your extracted dist/ directory.
# data/config.json: production=true, bind="127.0.0.1:3000",
# trust="127.0.0.1", set_real_ip_from="X-Forwarded-For", origins=["https://domain.com"], base_url="/commonroom/".

location = /commonroom {
    return 308 /commonroom/;
}

# Only HTTP API requests go to Rust. Preserve the base path (no trailing
# slash on proxy_pass). Unknown API paths remain backend 404 responses.
location ^~ /commonroom/api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 8k;
    # Media completion may make several bounded storage requests.
    proxy_read_timeout 130s;
}

# The exact WebSocket endpoint also goes to Rust, with upgrade headers.
location = /commonroom/ws {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    client_max_body_size 8k;
}

# The opaque-origin HTML preview uses a separate CSP, including without Nginx
# via its leading meta policy. Versioned URLs are cached across virtual scrolling.
location = /commonroom/markdown-frame.html {
    alias /srv/commonroom/dist/markdown-frame.html;
    default_type text/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; font-src data:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
}

# When media uploads are enabled, add the exact CHAT_S3_PUBLIC_ENDPOINT
# origin (for example https://media.example.com) to connect-src and media-src below.
# Apply the 25 MiB upload body limit on the separate storage proxy.
# Nginx serves index.html and assets directly; missing files return 404.
# The trailing slash keeps relative UI/API/WebSocket URLs under this prefix.
# Vite content-hashed assets are immutable; do not cache missing assets.
location ^~ /commonroom/assets/ {
    alias /srv/commonroom/dist/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' http: https: data: blob:; font-src 'self' data:; connect-src 'self' wss://$http_host; media-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests" always;
}

# Serve HTML and the unversioned worker while revalidating in the background.
location ^~ /commonroom/ {
    alias /srv/commonroom/dist/;
    index index.html;
    add_header Cache-Control "public, max-age=0, stale-while-revalidate=7200" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' http: https: data: blob:; font-src 'self' data:; connect-src 'self' wss://$http_host; media-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests" always;
}
